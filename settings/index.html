<body>

    <nav class="navbar" id="navbar">
        <div class="logo-container">
            <div class="logo active">
                <img src="/assets/favicon.ico" alt="Logo">

            </div>
            <div id="sync-status-indicator" class="sync-status" style="display: none;"></div>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="ti ti-home"></i> <span>Home</span></a></li>

    <div id="container">
        <div class="info-wrap">

        </div>
    </div>

    <div class="settings-container">
        <div class="settings-content">

            <div id="user-info" class="settings-card info-card">
                <div class="avatar"><i class="ti ti-user"></i></div>
                <div class="details">
                    <h2 id="user-name">Loading...</h2>
                    <p id="user-email">Please wait</p>
                </div>
            </div>

            <div class="settings-card actions-card">
                <button class="settings-btn" id="reset-pwd-btn"><i class="ti ti-key"></i> Reset
                    Password</button>
                <button class="settings-btn danger-btn" id="logout-btn"><i class="ti ti-logout"></i>
                    Logout</button>
            </div>

            <p id="settings-message" style="text-align: center; margin-block: 15px; font-size: 0.9rem;"></p>

        </div>
    </div>

    <div class="desktop-nav-empty"></div>

    <nav class="bottom-navbar">
        <a href="/calendar/" class="nav-item">
            <i class="ti ti-calendar"></i>
