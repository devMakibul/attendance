<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Settings - Attendance</title>
    <meta name="title" content="Attendance Tracker - Settings">
    <link href='/assets/favicon.ico' rel='shortcut icon' sizes='any' type='image/png' />

    <link rel="stylesheet" href="/assets/bottom-nav.css">
    <link rel="stylesheet" href="/assets/navbar.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/stats/style.css">

    <script src="/assets/icons/icons.js"></script>
    <script src="/assets/navbar.js"></script>
    <script src="/assets/firebase-config.js" type="module"></script>
    <script type="module" src="script.js"></script>
</head>

<body>

    <nav class="navbar" id="navbar">
        <div class="logo-container">
            <div class="logo active">
                <img src="/assets/favicon.ico" alt="Logo">
                <h1 class="page-title">Settings</h1>
            </div>
            <div id="sync-status-indicator" class="sync-status" style="display: none;"></div>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="ti ti-home"></i> <span>Home</span></a></li>
            <li><a href="/schedules/"><i class="ti ti-book"></i> <span>Schedules</span></a></li>
            <li><a href="/calendar/"><i class="ti ti-calendar"></i> <span>Calendar</span></a></li>
            <li><a href="/stats/"><i class="ti ti-chart-bar"></i> <span>Stats</span></a></li>
            <li class="active-page"><a href="/settings/"><i class="ti ti-settings"></i> <span>Settings</span></a></li>
        </ul>
        <div class="wavy-line"></div>
    </nav>

    <div id="container">
        <div class="info-wrap">

        </div>
    </div>

    <div class="settings-container">

        <div class="minimal-profile">
            <div class="minimal-avatar"><i class="ti ti-user"></i></div>
            <div class="minimal-details">
                <h2 id="user-name">Loading...</h2>
                <p id="user-email">Please wait</p>
            </div>
        </div>

        <div id="settings-message" class="settings-message"></div>

        <div class="minimal-list">
            <button class="minimal-item" onclick="openModal('name')">
                <div class="minimal-item-left">
                    <i class="ti ti-user-edit"></i>
                    <span>Change Name</span>
                </div>
                <i class="ti ti-chevron-right minimal-chevron"></i>
            </button>
            <button class="minimal-item" onclick="openModal('password')">
                <div class="minimal-item-left">
                    <i class="ti ti-lock"></i>
                    <span>Change Password</span>
                </div>
                <i class="ti ti-chevron-right minimal-chevron"></i>
            </button>
            <button class="minimal-item" onclick="openModal('email')">
                <div class="minimal-item-left">
                    <i class="ti ti-mail"></i>
                    <span>Change Email Address</span>
                </div>
                <i class="ti ti-chevron-right minimal-chevron"></i>
            </button>
            <button class="minimal-item danger-text" id="logout-btn">
                <div class="minimal-item-left">
                    <i class="ti ti-logout"></i>
                    <span>Logout</span>
                </div>
            </button>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Change Data</h2>
                <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
            </div>
            <div class="modal-body" style="padding: 20px 20px;">
                <p id="modal-desc"
                    style="text-align: center; color: var(--text-muted, #555); font-size: 0.95rem; margin-bottom: 20px;">
                    Please enter your new details below.
                </p>

                <div class="input-group" id="group-new-data">
                    <i class="ti ti-edit" id="new-data-icon"></i>
                    <input type="password" id="new-data-input" placeholder="New Value" />
                </div>

                <div class="input-group" id="group-confirm-data">
                    <i class="ti ti-key" id="confirm-data-icon"></i>
                    <input type="password" id="confirm-data-input" placeholder="Confirm New Value" />
                </div>

                <div class="input-group" id="group-current-password" style="margin-top: 25px;">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="current-password" placeholder="Current Password" />
                </div>

                <div class="show-pwd-container" id="show-pwd-container" style="display: none;">
                    <label
                        style="font-size: 0.95rem; color: var(--text-color, #333); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500;">
                        <input type="checkbox" id="show-modal-pwd" class="custom-checkbox"> Show password
                    </label>
                </div>

                <div id="modal-msg" style="text-align: center; font-size: 0.95rem; min-height: 20px; font-weight: 600;">
                </div>

                <div class="modal-actions" style="margin-top: 15px; display: flex; gap: 15px;">
                    <button class="stats-row val present" id="modal-save-btn" onclick="submitModal()"
                        style="flex: 1; justify-content: center; border: none; font-size: 1rem; cursor: pointer; padding: 10px; border-radius: 30px; background-color: #3139FB; color: white;">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div class="desktop-nav-empty"></div>

    <nav class="bottom-navbar">
        <a href="/calendar/" class="nav-item">
            <i class="ti ti-calendar"></i>
            <span>Calendar</span>
        </a>
        <a href="/stats/" class="nav-item">
            <i class="ti ti-chart-bar"></i>
            <span>Stats</span>
        </a>
        <a href="/schedules/" class="nav-item">
            <i class="ti ti-book"></i>
            <span>Schedules</span>
        </a>
    </nav>

    <footer>
        <h2>Attendance</h2>
        <div class="explore">
            <a href="/schedules/"><i class="ti ti-book"></i> Schedules</a>
            <a href="/calendar/"><i class="ti ti-calendar"></i> Calendar</a>
            <a href="/stats/"><i class="ti ti-chart-bar"></i> Stats</a>

            <span>Explore</span>
            <a href="/pages/about/"><i class="ti ti-help-circle"></i> About</a>
            <a href="/pages/privacy/"><i class="ti ti-shield"></i> Privacy</a>
            <a href="/pages/disclaimer/"><i class="ti ti-info-circle"></i> Disclaimer</a>
            <a href="/pages/sitemap/"><i class="ti ti-sitemap"></i> Sitemap</a>
        </div>

        <div class="dev">
            <h3>made by <a href="https://makibul.com" target="_blank">Makibul</a>.</h3>
            <a class="social" href="https://makibul.com" target="_blank"><i class="ti ti-world"></i></a>
            <a class="social" href="mailto:contactmakibul+attendance@gmail.com" target="_blank"><i
                    class="ti ti-mail"></i></a>
            <a class="social" href="https://github.com/devMakibul" target="_blank"><i
                    class="ti ti-brand-github"></i></a>
            <a class="social" href="https://t.me/mak1bul" target="_blank"><i class="ti ti-brand-telegram"></i></a>
            <a class="social" href="https://paypal.me/mak1bul" target="_blank"><i class="ti ti-brand-paypal"></i></a>
        </div>
    </footer>

</body>

</html>
