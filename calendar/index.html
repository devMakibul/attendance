<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Calendar</title>
    <meta name="title" content="Attendance Tracker">
    <meta content='Personal class attendance tracking tool' name='description' />
    <meta content='website' property='og:type' />
    <meta content='https://attendance.makibul.com/calendar/' property='og:url' />
    <meta content='Attendance Tracker - Personal class attendance tracking tool' property='og:title' />
    <meta content='Personal class attendance tracking tool' property='og:description' />
    <meta content='/assets/meta-banner.jpg' property='og:image' />
    <meta content='summary_large_image' property='twitter:card' />
    <meta content='@devMakibul' name='twitter:site' />
    <meta content='@devMakibul' name='twitter:creator' />
    <meta content='https://attendance.makibul.com/calendar/' property='twitter:url' />
    <meta content='Attendance Tracker - Personal class attendance tracking tool' property='twitter:title' />
    <meta content='Personal class attendance tracking tool' property='twitter:description' />
    <meta content='/assets/meta-banner.jpg' property='twitter:image' />
    <link href='/assets/apple-touch-icon.png' rel='apple-touch-icon' sizes='180x180' />
    <link href='/assets/favicon.ico' rel='shortcut icon' sizes='any' type='image/png' />
    <link href='/assets/manifest.json' rel='manifest' />
    <script src="/assets/firebase-config.js" type="module"></script>
    <script src="https://beamanalytics.b-cdn.net/beam.min.js" data-token="c14842ae-4407-4257-837d-42328a45648b"
        async></script>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="/assets/class-switcher.css">
    <script src="/assets/icons/icons.js"></script>

    <link rel="stylesheet" href="/assets/bottom-nav.css">
    <link rel="stylesheet" href="/assets/skeleton.css">
    <link rel="stylesheet" href="/assets/navbar.css">
    <script src="/assets/navbar.js"></script>

</head>

<body>

    <nav class="navbar" id="navbar">
        <div class="logo-container">
            <div class="logo active">
                <img src="/assets/favicon.ico" alt="Logo">
                <h1 class="page-title">Calendar</h1>
            </div>
            <div class="sync-status" id="sync-status-indicator" style="display: none;">
                <span class="sync-icon"><i class="ti ti-cloud-check"></i></span>
                <span class="sync-text">Changes saved</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="ti ti-home"></i> <span>Home</span></a></li>
            <li><a href="/schedules/"><i class="ti ti-book"></i> <span>Schedules</span></a></li>
            <li class="active-page"><a href="/calendar/"><i class="ti ti-calendar"></i> <span>Calendar</span></a></li>
            <li><a href="/stats/"><i class="ti ti-chart-bar"></i> <span>Stats</span></a></li>
            <li><a href="/settings/"><i class="ti ti-settings"></i> <span>Settings</span></a></li>
        </ul>
        <div class="wavy-line"></div>
    </nav>

    <div id="calendar-skeleton" class="skeleton-container">
        <div class="info-wrap">
            <div class="table-info skeleton-box" style="height: 119px; border-radius: 20px; margin-top: 0;"></div>
        </div>
        <div class="bottom-nav skeleton-bottom-nav">
            <div class="skeleton-box skeleton-icon-btn"></div>
            <div class="skeleton-box skeleton-month-pill"></div>
            <div class="skeleton-box skeleton-icon-btn"></div>
        </div>
        <div class="calendar skeleton-calendar-grid">
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
            <div class="skeleton-box skeleton-day-card"></div>
        </div>
    </div>

    <section class="calendar-data" id="calendar-data" style="display: none;">

        <div class="info-wrap">

            <div id="pwa" style="display: none;">
                <div class="pwa-image"><img src="/assets/pwa-icon.png" alt="pwa install icon"></div>
                <div class="pwa-info">
                    <div class="pwa-desc">To quickly track attendance add this page to your home screen and enjoy a
                        smoother experience.</div>
                    <button id="installButton"><i class="ti ti-device-mobile-down"></i> Add to home screen</button>
                </div>
            </div>

            <div id="info"></div>
        </div>

        <div class="bottom-nav" id="bottom-nav">

            <button class="history-btn" onclick="showActivitiesContainer()">
                <i class="ti ti-history"></i>
            </button>

            <div class="calendar-controls">
                <button id="prev-month" class="month-btn">
                    <i class="ti ti-arrow-left"></i>
                </button>
                <div id="current-month" class="current-month"></div>
                <button id="next-month" class="month-btn">
                    <i class="ti ti-arrow-right"></i>
                </button>
            </div>

            <button id="navigate-todays-card">
                <img class='rotating-image' id='rotating-image' src='/assets/rotating-image.png'><i
                    class="ti ti-arrow-down"></i>
            </button>
        </div>

        <div id="calendar" class="calendar"></div>

        <div class="usage-note tip" id="usage-note">
            <i class="ti ti-hand-finger"></i> Double tap on <span>P</span> or <span>A</span> to mark as Present or
            Absent. <br><br><i class="ti ti-clock"></i> Tap and hold to reset.
        </div>

        <div id="attendance-popup" style="display: none;">
            <div id="attendance-popup-content"></div>
        </div>

        <div id="popup"></div>
        <div id="history-popup">
            <div class="history-container">
                <div class="history-title"><i class="ti ti-history"></i> Recent Activities</div>
                <div id="histories"></div>
                <button class="close-history" onclick="closeActivitiesContainer()"><i class="ti ti-x"></i>Close</button>
            </div>
        </div>
    </section>

    <div id="customAlert" class="modal">
        <div class="modal-content">
            <p id="alertMessage"></p>
            <button id="alertConfirm"><i class="ti ti-check"></i>OK</button>
        </div>
    </div>

    <nav class="bottom-navbar">
        <a href="/calendar/" class="nav-item active">
            <i class="ti ti-calendar"></i>
            <span>Calendar</span>
        </a>
        <a href="/stats/" class="nav-item">
            <i class="ti ti-chart-bar"></i>
            <span>Stats</span>
        </a>
        <a href="/schedules/" class="nav-item">
            <i class="ti ti-book"></i>
            <span>Schedules</span>
        </a>
    </nav>

    <script src="/assets/class-manager.js"></script>
    <script src="/assets/class-switcher.js"></script>
    <script type="module" src="script.js"></script>

</body>

</html>
