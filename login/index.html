<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Attendance</title>
    <meta name="title" content="Attendance Tracker - Login">
    <link href='/assets/favicon.ico' rel='shortcut icon' sizes='any' type='image/png' />
    <link rel="stylesheet" href="style.css">
    <script src="/assets/icons/icons.js"></script>
    <link rel="stylesheet" href="/assets/navbar.css">
    <link rel="stylesheet" href="/stats/style.css">
</head>

<body>

    <nav class="navbar" id="navbar">
        <div class="logo-container">
            <div class="logo active">
                <img src="/assets/favicon.ico" alt="Logo">
                <h1 class="page-title">Login</h1>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="/"><i class="ti ti-home"></i> <span>Home</span></a></li>
            <li class="active-page"><a href="/login/"><i class="ti ti-user"></i> <span>Login</span></a></li>
        </ul>
        <div class="wavy-line"></div>
    </nav>

    <div id="container">
        <div class="info-wrap">

        </div>
    </div>

    <div class="auth-container">

        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="showTab('login')">Login</button>
                <button class="auth-tab" onclick="showTab('signup')">Sign Up</button>
            </div>

            <div id="login-tab">
                <div class="auth-header">
                    <h2>Welcome back</h2>
                    <p>Log in to access your attendance.</p>
                </div>
                <div class="input-group">
                    <i class="ti ti-mail"></i>
                    <input type="email" id="login-email" placeholder="Email" />
                </div>
                <div class="input-group">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" />
                </div>
                <div class="show-pwd-container"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <label
                        style="font-size: 0.95rem; color: var(--text-color); display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500;">
                        <input type="checkbox" id="show-login-pwd" class="custom-checkbox"> Show password
                    </label>
                    <a href="#" onclick="forgotPassword(event)"
                        style="font-size: 0.9rem; color: var(--primary-color); text-decoration: none; font-weight: 600;">Forgot
                        password?</a>
                </div>
                <p id="login-message" class="auth-message"></p>
                <button class="auth-btn" id="login-btn" onclick="login()">
                    <span>Login</span>
                    <i class="ti ti-arrow-right"></i>
                </button>
                <div class="auth-divider"><span>or</span></div>
                <button class="auth-btn google-btn" onclick="loginWithGoogle()">
                    <i class="ti ti-google"></i>
                    <span>Continue with Google</span>
                </button>

            </div>

            <div id="signup-tab" style="display:none">
                <div class="auth-header">
                    <h2>Create account</h2>
                    <p>Start tracking your attendance by creating an account.</p>
                </div>
                <div class="input-group">
                    <i class="ti ti-user"></i>
                    <input type="text" id="signup-name" placeholder="Full Name" />
                </div>
                <div class="input-group">
                    <i class="ti ti-mail"></i>
                    <input type="email" id="signup-email" placeholder="Email" />
                </div>
                <div class="input-group">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="signup-password" placeholder="Password (min 6 chars)" />
                </div>
                <div class="input-group">
                    <i class="ti ti-lock"></i>
                    <input type="password" id="signup-confirm-pwd" placeholder="Confirm Password" />
                </div>
                <div class="show-pwd-container"
                    style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px;">
                    <label
                        style="font-size: 0.95rem; color: var(--text-color); display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500;">
                        <input type="checkbox" id="show-signup-pwd" class="custom-checkbox"> Show passwords
                    </label>
                    <label
                        style="font-size: 0.95rem; color: var(--text-color); display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-weight: 500; line-height: 1.4;">
                        <input type="checkbox" id="agree-privacy" class="custom-checkbox" style="margin-top: 2px;">
                        <span>I agree to the <a href="/pages/privacy/" target="_blank"
                                style="color: var(--primary-color); text-decoration: none;">Privacy Policy</a> & <a
                                href="/pages/disclaimer/" target="_blank"
                                style="color: var(--primary-color); text-decoration: none;">Disclaimer</a></span>
                    </label>
                </div>
                <p id="signup-message" class="auth-message"></p>
                <button class="auth-btn" id="signup-btn" onclick="signup()">
                    <span>Sign Up</span>
                    <i class="ti ti-arrow-right"></i>
                </button>
                <div class="auth-divider"><span>or</span></div>
                <button class="auth-btn google-btn" onclick="loginWithGoogle()">
                    <i class="ti ti-google"></i>
                    <span>Continue with Google</span>
                </button>

            </div>

        </div>
    </div>

    <footer>
        <h2>Attendance</h2>
        <div class="explore">
            <span>Explore</span>
            <a href="/pages/about/"><i class="ti ti-help-circle"></i> About</a>
            <a href="/pages/privacy/"><i class="ti ti-shield"></i> Privacy</a>
            <a href="/pages/disclaimer/"><i class="ti ti-info-circle"></i> Disclaimer</a>
            <a href="/pages/sitemap/"><i class="ti ti-sitemap"></i> Sitemap</a>
        </div>

        <div class="dev">
            <h3>made by <a href="https://makibul.com" target="_blank">Makibul</a>.</h3>
            <a class="social" href="https://makibul.com" target="_blank"><i class="ti ti-world"></i></a>
            <a class="social" href="mailto:contactmakibul+attendance@gmail.com" target="_blank"><i
                    class="ti ti-mail"></i></a>
            <a class="social" href="https://github.com/devMakibul" target="_blank"><i
                    class="ti ti-brand-github"></i></a>
            <a class="social" href="https://t.me/mak1bul" target="_blank"><i class="ti ti-brand-telegram"></i></a>
            <a class="social" href="https://paypal.me/mak1bul" target="_blank"><i class="ti ti-brand-paypal"></i></a>
        </div>
    </footer>

    <script type="module" src="/assets/firebase-config.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
